models:
  actor:
    hidden_layers: [512, 512]
    activation: relu
    noise_std_type: fixed
    init_noise_std: 0.055

  critic:
    hidden_layers: [512, 512]
    activation: relu

  discriminator:
    hidden_layers: [512, 512]
    activation: relu

agent:
  class_type: HIL

  num_transitions_per_env: 16

  num_mini_batches: 2
  num_learning_epochs: 6
  learning_rate: 0.00005

  clip_param: 0.2
  value_loss_coef: 2.5
  entropy_coef: 0.01
  max_grad_norm: 0.0
  use_clipped_value_loss: False
  value_loss_clip_param: 0.2

  desired_kl: 0.01
  adaptive_kl: False

  gae_lambda: 0.95
  discount: 0.99
  normalize_advantage_per_mini_batch: False

  # AMP params
  discriminator_buffer_capacity: 2000000
  discriminator_update_interval: 1

  disc_lr: 0.00005
  disc_logit_reg: 0.05
  disc_grad_penalty: 5.0
  disc_weight_decay: 0.0001
  disc_loss_scale: 5.0
  grad_norm_clip: 0.0
  disc_num_updates: 4
  disc_batch_size: 4096
  
  style_reward_lambda: 3.0
  goal_reward_lambda: 1.0

  # HIL params
  # Number of steps to set: env steps, summed over all envs like runner.timesteps, that every env
  # trains on the tracking reward alone before the second half of the envs switch to AMP.
  warm_start_steps: 0
  # whether the env keeps drawing new commands, and training's key presses keep starting behaviors
  resample_commands: True
  sample_behaviors: True
  # whether the policy sees the command and behavior slots (phase included); off, they read 0
  observe_commands: True


runner:
  timesteps: 200000000
