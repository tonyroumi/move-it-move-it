
motions:
  walk_to_goal:
    file: data/locomotion/walk.npz
    sample_prob: 0.7

    commands:
      goal_x: [-5.0, 5.0]
      goal_y: [-5.0, 5.0]
    zero_command_prob: 0.25

    rewards:
      progress:
        weight: 1.0
        scale: 30.0
      target_hit:
        weight: 0.5
        scale: 0.5

    termination:
      unhealthy:
        height_threshold: 0.55

  step_touch:
    file: data/dance/step_touch_crop.npz
    sample_prob: 0.3
    trigger: binary_key_0
    amp: false
    random_start: true

    rewards:
      heading_motion_tracking:
        weight: 25.0
        dof_scale: 0.5
        key_body_scale: 1.0
      action_rate_l2:
        weight: 0.5
        scale: 1.0
      joint_acc:
        weight: 0.1
        scale: 1.0e-4

    termination:
      deviation_from_motion:
        threshold: 4.0