motions:
  walk_to_goal:
    file: data/walk.npz
    sample_prob: 1.0

    commands:
      goal_x: [-5.0, 5.0]
      goal_y: [-5.0, 5.0]

    zero_command_prob: 0.25

    rewards:
      progress:
        weight: 1.0
        scale: 30.0
      target_hit:
        weight: 0.5
        scale: 0.5

    # Within goal_radius of the goal (a zeroed command, or once it arrives) the robot is asked to
    # stand still: these rewards replace the ones above and the AMP style reward is off. 
    standing:
      goal_radius: 0.3
      # Standing pose tracking targets
      pose:
        right_hip_x: -0.12
        left_hip_x: 0.12
        right_ankle_x: 0.12
        left_ankle_x: -0.12
        right_shoulder_x: -0.18
        left_shoulder_x: 0.18
        right_elbow: -0.2
        left_elbow: -0.2
      rewards:
        target_hit:
          weight: 0.5
          scale: 0.5
        root_lin_vel_l2:
          weight: 1.0
          scale: 4.0
        root_ang_vel_l2:
          weight: 0.5
          scale: 2.0
        joint_vel:
          weight: 0.5
          scale: 5.0e-2
        upright:
          weight: 0.5
          scale: 10.0
        support_centered:
          weight: 0.5
          scale: 20.0
        standing_pose:
          weight: 0.75
          scale: 2.0
          tolerance: 0.05

    termination: unhealthy
