  stance_advance:
    file: data/boxing/orthodox_advance.npz
    sample_prob: 1.0
    commands: {goal_x: [-5.0, 5.0], goal_y: [-5.0, 5.0]}
    zero_command_prob: 0.25
    rewards:
      progress: {weight: 1.0, scale: 25.0}
      target_hit: {weight: 0.5, scale: 0.5}
    termination: unhealthy
    standing:
      rewards:
        target_hit:
          weight: 1.0
          scale: 0.5
        root_lin_vel_l2:
          weight: 1.0
          scale: 4.0
        root_ang_vel_l2:
          weight: 0.5
          scale: 2.0
        joint_vel:
          weight: 0.5
          scale: 5.0e-2
        upright:
          weight: 0.5
          scale: 10.0
        support_centered:
          weight: 0.5
          scale: 20.0
        reference_pose:
          weight: 0.75
          scale: 2.0
          tolerance: 0.05

