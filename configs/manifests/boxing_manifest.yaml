
motions:
  bounce:
    file: data/boxing/orthodox_bounce.npz
    sample_prob: 0.6

    rewards:
      heading_motion_tracking:
        weight: 25.0
        dof_scale: 0.5
        key_body_scale: 1.0
      action_rate_l2:
        weight: 0.5
        scale: 1.0
      joint_acc:
        weight: 0.1
        scale: 1.0e-4

    termination:
      unhealthy:
        height_threshold: 0.55

  cross_right:
    file: data/boxing/orthodox_cross_right.npz
