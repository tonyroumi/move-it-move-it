# Goal tracking with a jump: walking toward a world-space goal and standing still once there, as in
# goal_manifest.yaml, plus a standing broad jump that a key press runs once (Space in play). When the
# jump completes, the env goes back to walking to the goal, or to standing if the goal is within
# goal_radius. Clip paths are relative to the repo root. The jump is CMU trial 16_10; see the
# README's "Jump clip and attribution" for its source and where the clips come from.
# Weights are untuned; nothing here has been trained or run in Isaac Lab.
motions:
  walk_to_goal:
    file: data/locomotion/walk.npz
    sample_prob: 0.8
    commands: {goal_x: [-5.0, 5.0], goal_y: [-5.0, 5.0]}
    # a zeroed command puts the goal where the root already is: stand there
    zero_command_prob: 0.25
    rewards:
      # meters closer per step, times 30 = 1 / step_dt: roughly speed toward the goal in m/s
      progress: {weight: 1.0, scale: 30.0}
      target_hit: {weight: 0.5, scale: 0.5}
    # within goal_radius of the goal, these rewards replace the ones above and AMP's style reward is
    # off; the same block as configs/manifests/goal_manifest.yaml
    standing:
      goal_radius: 0.3
      pose:
        right_hip_x: -0.12
        left_hip_x: 0.12
        right_ankle_x: 0.12
        left_ankle_x: -0.12
        right_shoulder_x: -0.18
        left_shoulder_x: 0.18
        right_elbow: -0.2
        left_elbow: -0.2
      rewards:
        target_hit: {weight: 0.5, scale: 0.5}
        root_lin_vel_l2: {weight: 1.0, scale: 4.0}
        root_ang_vel_l2: {weight: 0.5, scale: 2.0}
        joint_vel: {weight: 0.5, scale: 5.0e-2}
        upright: {weight: 0.5, scale: 10.0}
        support_centered: {weight: 0.5, scale: 20.0}
        standing_pose: {weight: 0.75, scale: 2.0, tolerance: 0.05}
    termination: unhealthy

  # 2.93 s: stands for about 0.4 s, winds up, takes off at 1.45 s (phase 0.49), lands at 2.0 s (0.68)
  # about 2 m ahead along its heading, and stands again. settle: the jump also completes once it is
  # min_phase through and the RMS joint speed is below max_dof_speed (rad/s). The robot stands just
  # as still before the wind-up, so min_phase is the clip's last joint speed above 1 rad/s, after
  # the landing is absorbed. The clip itself drops below 0.6 rad/s at phase 0.93.
  jump:
    file: data/jump/standing_broad_jump.npz
    trigger: binary_key_1
    sample_prob: 0.2
    settle: {min_phase: 0.9, max_dof_speed: 0.6}
    rewards:
      heading_motion_tracking: {weight: 2.0}
    termination: unhealthy
