
motions:
  walk_to_goal:
    file: data/locomotion/walk.npz
    sample_prob: 0.5

    commands:
      goal_x: [-5.0, 5.0]
      goal_y: [-5.0, 5.0]
      
    zero_command_prob: 0.25

    rewards:
      progress:
        weight: 1.0
        scale: 30.0
      target_hit:
        weight: 0.5
        scale: 0.5

    termination:
      unhealthy:

  jump:
    file: data/jump/standing_broad_jump.npz
    sample_prob: 0.5
    trigger: binary_key_0
    amp: 0.0
    random_start: false

    rewards:
      heading_motion_tracking:
        weight: 25.0
        dof_scale: 0.5
        key_body_scale: 0.5
      action_rate_l2:
        weight: 0.5
        scale: 1.0
      joint_acc:
        weight: 0.1
        scale: 1.0e-4

    termination:
      unhealthy:
      deviation_from_motion:
        threshold: 5.0
